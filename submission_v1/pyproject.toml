[project]
name = "sba928-market-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Richard Watson Jr", email = "200259687+rwnycvet@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[project.scripts]
sba928-market-research = "sba928_market_research:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
